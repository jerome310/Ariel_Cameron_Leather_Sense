    font-family: 'Irish Grover', 'Arial Rounded MT Bold', Arial, sans-serif;

  /* ---- Mobile responsiveness ---- */
  @media only screen and (max-width: 480px) {
    .container { width: 100% !important; }

    .content-padding { padding: 30px 24px 0 24px !important; }

    /* Stack logo + headline vertically and center everything */
    .logo-cell {
      display: block !important;
      width: 100% !important;
      text-align: center !important;
      padding: 0 0 20px 0 !important;
    }
    .logo-table { margin: 0 auto !important; }

    .headline-cell {
      display: block !important;
      width: 100% !important;
      text-align: center !important;
      padding: 0 !important;
    }
    .headline {
      font-size: 30px !important;
      line-height: 34px !important;
      text-align: center !important;
    }

    /* Let the CTA button shrink but never overflow the screen */
    .cta-table {
      width: 90% !important;
      max-width: 320px !important;
    }
    .button-text { font-size: 18px !important; }

    /* Tighten up icon spacing a touch on small screens */
    .social-cell { padding: 0 10px !important; }
  }
